  window.HVOS_CONTENT_READY = (async function boot() {
    const res = await fetch('https://cdn.jsdelivr.net/gh/KingRafer/high-value-schedule@4901078a95734cfe51520a9cbad504c280225c95/index.html');
    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const main = doc.querySelector('main.content');
    const modals = doc.querySelector('#modal-overlay');
    const ourMain = document.getElementById('main-content');
    if (main) {
      ourMain.innerHTML = main.innerHTML;
      ourMain.insertAdjacentHTML('beforeend', document.getElementById('extra-sections').innerHTML);
    }
    if (modals) {
      document.getElementById('modal-overlay').innerHTML = modals.innerHTML +
        document.getElementById('extra-modals').innerHTML;
    }
    document.getElementById('boot-msg')?.remove();
  })();

  <script>
  (function () {
    const input = document.getElementById('global-search');
    const clear = document.getElementById('global-search-clear');
    const nav = document.querySelector('.sidebar-nav');
    if (!input || !nav) return;
    function getItems() { return Array.from(nav.querySelectorAll('.nav-item')); }
    function filter() {
      const q = input.value.trim().toLocaleLowerCase('id');
      getItems().forEach(item => {
        const match = !q || item.textContent.toLocaleLowerCase('id').includes(q);
        item.hidden = !match;
      });
      clear.style.visibility = input.value ? 'visible' : 'hidden';
    }
    input.addEventListener('input', filter);
    clear.addEventListener('click', () => { input.value = ''; filter(); input.focus(); });
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') { input.value = ''; filter(); input.blur(); }
      if (e.key === 'Enter') {
        const first = getItems().find(item => !item.hidden);
        if (first) first.click();
      }
    });
    document.addEventListener('keydown', e => {
      if (e.key === '/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && !e.ctrlKey && !e.metaKey) {
        e.preventDefault(); input.focus();
      }
    });
    filter();
  })();
  </script>
  <script src="cloud-bootstrap.js"></script>
  <script src="app.js"></script>
